<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home-page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index_style.css') }}">
</head>
<body>
    <div class="container">
        <nav class="navigation-bar">
            <div class="product-identity">
                <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="product-logo" class="product-logo">
                <h1 class="product-name">Vital Pulse AI</h1>
            </div>
            <div class="navigation-panel">
                <a href="/" class="home active">Home</a> <a href="/about" class="product">Product</a>
                <a href="/team" class="team">Our Team</a>
            </div>
            <button class="browse-btn" onclick="window.location.href='/signin'">Get Started</button>
        </nav>
        <div class="content">
            <div class="backdrop">
                <p>Welcome!</p>
                <h1>Predict the Risk, <br>Shape the outcome.</h1>
                <button class="product" onclick="window.location.href='/about'">Try our product</button>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('.product').addEventListener('click', function() {
            fetch('/product')
                .then(response => response.json())
                .then(data => {
                    console.log(data);
                    // You can also update the UI with the received data if needed
                })
                .catch(error => console.error('Error fetching product data:', error));
        });
    </script>
</body>
</html>
